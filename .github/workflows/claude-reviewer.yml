name: Claude Reviewer

# The "evaluator" half of the harness.
# Runs on every PR push. Separate workflow run = separate context from the coder,
# which is what makes the review independent (per Anthropic's harness-design research:
# self-review by the same context fails — the model praises its own work).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]

concurrency:
  group: claude-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            CLAUDE.md (already loaded into your context) has the project conventions and review criteria. AGENTS.md has the Vite+ toolchain reference if you need command details.

            Workflow:
            1. Read the PR body to understand the intent (the "sprint contract").
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the changes.
            3. Open the changed files in context — don't just review the diff in isolation.
            4. For each substantive issue, post an inline review comment on the specific line using the `mcp__github_inline_comment__create_inline_comment` tool.
            5. Post a single top-level summary comment with `gh pr comment` once you're done.

            Bar for raising an issue: substantive only. oxlint already handles style.
            Specifically focus on:
            - Logic errors and edge cases the author may have missed
            - Security: prompt-injection vectors in workflow files, secret exposure, unsafe shell expansion
            - Mismatch between PR description and actual diff
            - Cross-file consistency across this monorepo (apps/* and packages/*)
            - Whether tests cover the change (if the change has testable behavior)

            DO NOT rubber-stamp. DO NOT nitpick. If the PR is genuinely clean, say so concisely in the summary comment.
          claude_args: --model claude-opus-4-7 --max-turns 15 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep,LS"
